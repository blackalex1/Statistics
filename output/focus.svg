<svg width="850" height="180" viewBox="0 0 850 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    
    <style>
        :root {
            --f-bg: #0d1117;
            --f-accent: #00FFAA;
            --f-text: #ffffff;
            --f-secondary: #8b949e;
            --f-border: #30363d;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --f-bg: #ffffff;
                --f-accent: #0969da;
                --f-text: #1f2328;
                --f-secondary: #57606a;
                --f-border: #d0d7de;
            }
        }

        .f-card {
            fill: var(--f-bg);
            stroke: var(--f-border);
            stroke-width: 1;
            transition: all 0.3s;
        }
        
        .f-card:hover {
            stroke: var(--f-accent);
        }

        .f-tag {
            font: bold 12px monospace;
            fill: var(--f-accent);
            letter-spacing: 1px;
        }

        .f-title {
            font: bold 13px 'Segoe UI', sans-serif;
            fill: var(--f-text);
        }

        .f-desc {
            font: 10px 'Segoe UI', sans-serif;
            fill: var(--f-secondary);
        }

        .f-accent-line {
            stroke: var(--f-accent);
            stroke-width: 2;
            stroke-linecap: round;
        }

        .f-indicator {
            fill: var(--f-accent);
            opacity: 0.8;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.9; }
        }

        .f-appear {
            opacity: 0;
            animation: f-fadeIn 0.5s forwards;
        }

        @keyframes f-fadeIn {
            to { opacity: 1; transform: translateY(0); }
            from { opacity: 0; transform: translateY(10px); }
        }
        
        .f-corner { fill: var(--f-accent); }
    </style>
    
    
    <text x="10" y="25" style="font: bold 16px monospace; fill: var(--f-text); letter-spacing: 2px;">STRATEGIC_FOCUS // CORE_DOMAINS</text>
    <line x1="10" y1="30" x2="330" y2="30" stroke="#00FFAA" stroke-width="1" opacity="0.3"/>

    
        <g class="f-appear" style="animation-delay: 0.0s;">
            <rect x="10" y="40" width="155" height="130" rx="6" class="f-card"/>
            
            <!-- Corner Accent -->
            <path d="M 10 55 L 10 40 L 25 40" fill="none" stroke="#00FFAA" stroke-width="1.5" opacity="0.6"/>
            
            <text x="22" y="65" class="f-tag">BACKEND</text>
            <text x="22" y="88" class="f-title">High-Perf APIs</text>
            
            <!-- Wrapping description -->
            <text x="22" y="110" class="f-desc">Go, Python, FastAPI</text>
            <text x="22" y="125" class="f-desc">gRPC, Protobuf &amp; WSS</text>
            
            <rect x="22" y="150" width="130" height="3" rx="1.5" fill="var(--f-border)"/>
            <rect x="22" y="150" width="115" height="3" rx="1.5" class="f-indicator"/>
        </g>
        
        <g class="f-appear" style="animation-delay: 0.1s;">
            <rect x="177" y="40" width="155" height="130" rx="6" class="f-card"/>
            
            <!-- Corner Accent -->
            <path d="M 177 55 L 177 40 L 192 40" fill="none" stroke="#00FFAA" stroke-width="1.5" opacity="0.6"/>
            
            <text x="189" y="65" class="f-tag">CLIENTS</text>
            <text x="189" y="88" class="f-title">Web, Mobile &amp; PC</text>
            
            <!-- Wrapping description -->
            <text x="189" y="110" class="f-desc">JavaScript &amp; TypeScript</text>
            <text x="189" y="125" class="f-desc">Kotlin, Compose &amp; C#</text>
            
            <rect x="189" y="150" width="130" height="3" rx="1.5" fill="var(--f-border)"/>
            <rect x="189" y="150" width="110" height="3" rx="1.5" class="f-indicator"/>
        </g>
        
        <g class="f-appear" style="animation-delay: 0.2s;">
            <rect x="344" y="40" width="155" height="130" rx="6" class="f-card"/>
            
            <!-- Corner Accent -->
            <path d="M 344 55 L 344 40 L 359 40" fill="none" stroke="#00FFAA" stroke-width="1.5" opacity="0.6"/>
            
            <text x="356" y="65" class="f-tag">NETWORK</text>
            <text x="356" y="88" class="f-title">Routing &amp; Firewalls</text>
            
            <!-- Wrapping description -->
            <text x="356" y="110" class="f-desc">iptables, TPROXY &amp; TUN</text>
            <text x="356" y="125" class="f-desc">Sing-box, Xray, Hysteria</text>
            
            <rect x="356" y="150" width="130" height="3" rx="1.5" fill="var(--f-border)"/>
            <rect x="356" y="150" width="115" height="3" rx="1.5" class="f-indicator"/>
        </g>
        
        <g class="f-appear" style="animation-delay: 0.30000000000000004s;">
            <rect x="511" y="40" width="155" height="130" rx="6" class="f-card"/>
            
            <!-- Corner Accent -->
            <path d="M 511 55 L 511 40 L 526 40" fill="none" stroke="#00FFAA" stroke-width="1.5" opacity="0.6"/>
            
            <text x="523" y="65" class="f-tag">SYSTEMS</text>
            <text x="523" y="88" class="f-title">Systems &amp; Linux</text>
            
            <!-- Wrapping description -->
            <text x="523" y="110" class="f-desc">Rust, C/C++, Linux ALSA</text>
            <text x="523" y="125" class="f-desc">Daemons &amp; Raw Sockets</text>
            
            <rect x="523" y="150" width="130" height="3" rx="1.5" fill="var(--f-border)"/>
            <rect x="523" y="150" width="90" height="3" rx="1.5" class="f-indicator"/>
        </g>
        
        <g class="f-appear" style="animation-delay: 0.4s;">
            <rect x="678" y="40" width="155" height="130" rx="6" class="f-card"/>
            
            <!-- Corner Accent -->
            <path d="M 678 55 L 678 40 L 693 40" fill="none" stroke="#00FFAA" stroke-width="1.5" opacity="0.6"/>
            
            <text x="690" y="65" class="f-tag">INFRA</text>
            <text x="690" y="88" class="f-title">DevOps &amp; Virt</text>
            
            <!-- Wrapping description -->
            <text x="690" y="110" class="f-desc">Proxmox VE, LXC, Docker</text>
            <text x="690" y="125" class="f-desc">Linux &amp; GitHub Actions</text>
            
            <rect x="690" y="150" width="130" height="3" rx="1.5" fill="var(--f-border)"/>
            <rect x="690" y="150" width="95" height="3" rx="1.5" class="f-indicator"/>
        </g>
        
</svg>