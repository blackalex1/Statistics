        </text>
        
        <text x="40" y="-30" class="h-matrix-text" style="animation-delay: 1.67s; animation-duration: 6.39s; font-size: 12px;">
            EXE👾█ROOT|&lt;ROOT&lt;0
        </text>
        
        <text x="64" y="-30" class="h-matrix-text" style="animation-delay: 1.86s; animation-duration: 6.05s; font-size: 10px;">
            ⚡SYS█}_[👾]ROOT
        </text>
        
        <text x="88" y="-30" class="h-matrix-text" style="animation-delay: 1.22s; animation-duration: 4.6s; font-size: 11px;">
            EXEDIR}&lt;1_-DIR}
        </text>
        
        <text x="112" y="-30" class="h-matrix-text" style="animation-delay: 0.93s; animation-duration: 6.38s; font-size: 10px;">
