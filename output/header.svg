<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="h-clip-standalone">
      <rect width="800" height="200" rx="12"/>
    </clipPath>
    <radialGradient id="h-text-shield-standalone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--h-bg)" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="var(--h-bg)" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="var(--h-bg)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-mask-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--h-bg)" stop-opacity="1"/>
      <stop offset="18%" stop-color="var(--h-bg)" stop-opacity="0"/>
      <stop offset="82%" stop-color="var(--h-bg)" stop-opacity="0"/>
      <stop offset="100%" stop-color="var(--h-bg)" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <style>
    :root { 
      --h-bg: #0d1117; 
      --h-text: #ffffff; 
      --h-accent: #00FFAA; 
      --h-border: #30363d;
      --h-muted: #8b949e;
      --h-matrix-opacity: 0.22;
    }
    @media (prefers-color-scheme: light) { 
      :root { 
        --h-bg: #ffffff; 
        --h-text: #1f2328; 
        --h-accent: #1a7f37;
        --h-border: #d0d7de;
        --h-muted: #57606a;
        --h-matrix-opacity: 0.35;
      } 
    }

    .h-bg { fill: var(--h-bg); stroke: var(--h-border); stroke-width: 1.5; }

    .h-title { 
      font: bold 52px 'JetBrains Mono', 'Segoe UI', monospace; 
      fill: var(--h-accent); 
      text-transform: uppercase; 
      letter-spacing: 8px;
      animation: h-glitch 6s infinite ease-in-out;
      transform-origin: center;
    }
    
    .h-subtitle { 
      font: bold 14px 'JetBrains Mono', 'Courier New', monospace; 
      fill: var(--h-text); 
      letter-spacing: 3px; 
      text-transform: uppercase;
      opacity: 0.9;
    }

    .h-tagline {
      font: bold 10px 'JetBrains Mono', monospace;
      fill: var(--h-muted);
      letter-spacing: 2px;
      opacity: 0.75;
    }

    .h-matrix-text { 
      font: bold 12px monospace;
      fill: var(--h-accent); 
      opacity: 0; 
      writing-mode: vertical-rl; 
      animation: h-fall linear infinite; 
    }

    @keyframes h-glitch {
      0%, 88%, 100% { transform: none; opacity: 1; }
      89% { transform: skew(-3deg) translate(-2px, 1px); opacity: 0.85; }
      90% { transform: skew(3deg) translate(2px, -1px); opacity: 0.9; }
      91% { transform: none; opacity: 1; }
      95% { transform: translate(-2px, -1px); }
      96% { transform: translate(2px, 1px); }
      97% { transform: none; }
    }

    @keyframes h-fall { 
      0% { transform: translateY(-40px); opacity: 0; } 
      15% { opacity: var(--h-matrix-opacity); } 
      80% { opacity: var(--h-matrix-opacity); } 
      100% { transform: translateY(200px); opacity: 0; } 
    }

    .h-scanline {
      width: 800px;
      height: 2px;
      fill: var(--h-accent);
      opacity: 0.08;
      animation: h-scan 4s infinite linear;
    }
    @keyframes h-scan {
      0% { transform: translateY(0); }
      100% { transform: translateY(200px); }
    }

    .h-corner { stroke: var(--h-accent); stroke-width: 2; fill: none; opacity: 0.8; stroke-linecap: square; }
    .h-reticle { stroke: var(--h-muted); stroke-width: 1; opacity: 0.4; }
  </style>

  <rect width="800" height="200" rx="12" class="h-bg"/>
  
  <g clip-path="url(#h-clip-standalone)">
    <g opacity="1">
        <text x="16" y="-30" class="h-matrix-text" style="animation-delay: 2.63s; animation-duration: 4.86s; font-size: 11px;">
            {EXE/0-👾/1[
        </text>
        
        <text x="40" y="-30" class="h-matrix-text" style="animation-delay: 1.57s; animation-duration: 5.08s; font-size: 12px;">
            EXE}|_]]SYS&lt;█
        </text>
        
        <text x="64" y="-30" class="h-matrix-text" style="animation-delay: 1.49s; animation-duration: 5.77s; font-size: 11px;">
            }}-ROOT{EXE&gt;EXE0
        </text>
        
        <text x="88" y="-30" class="h-matrix-text" style="animation-delay: 0.93s; animation-duration: 4.55s; font-size: 12px;">
            [&lt;SYS👾[{-⚡\
        </text>
        
        <text x="112" y="-30" class="h-matrix-text" style="animation-delay: 2.05s; animation-duration: 6.55s; font-size: 11px;">
            ]&gt;10x{}█|█
        </text>
        
        <text x="136" y="-30" class="h-matrix-text" style="animation-delay: 2.8s; animation-duration: 6.25s; font-size: 10px;">
            ROOT⚡[1█ROOT⚡SYSDIR
        </text>
        
        <text x="160" y="-30" class="h-matrix-text" style="animation-delay: 0.29s; animation-duration: 6.66s; font-size: 12px;">
            0x{}1|█/{👾
        </text>
        
        <text x="184" y="-30" class="h-matrix-text" style="animation-delay: 2.29s; animation-duration: 4.68s; font-size: 10px;">
            /]}█1&lt;}_&lt;
        </text>
        
        <text x="208" y="-30" class="h-matrix-text" style="animation-delay: 0.31s; animation-duration: 6.96s; font-size: 11px;">
            ROOTEXE|ROOT]👾DIR/EXE
        </text>
        
        <text x="600" y="-30" class="h-matrix-text" style="animation-delay: 0.4s; animation-duration: 5.82s; font-size: 12px;">
            █EXE_|101&lt;}
        </text>
        
        <text x="624" y="-30" class="h-matrix-text" style="animation-delay: 0.37s; animation-duration: 6.13s; font-size: 11px;">
            SYS-|█_EXE1█\
        </text>
        
        <text x="648" y="-30" class="h-matrix-text" style="animation-delay: 2.69s; animation-duration: 6.33s; font-size: 10px;">
            SYSSYS👾⚡0x-SYS]1
        </text>
        
        <text x="672" y="-30" class="h-matrix-text" style="animation-delay: 3.06s; animation-duration: 4.56s; font-size: 12px;">
            ]|[\DIRDIR]0-
        </text>
        
        <text x="696" y="-30" class="h-matrix-text" style="animation-delay: 2.81s; animation-duration: 6.6s; font-size: 11px;">
            SYSROOT[1]ROOT1\{
        </text>
        
        <text x="720" y="-30" class="h-matrix-text" style="animation-delay: 1.89s; animation-duration: 4.66s; font-size: 10px;">
            EXE&lt;-_1|EXE⚡1
        </text>
        
        <text x="744" y="-30" class="h-matrix-text" style="animation-delay: 2.02s; animation-duration: 5.13s; font-size: 10px;">
            [--EXEROOT]1}👾
        </text>
        
        <text x="768" y="-30" class="h-matrix-text" style="animation-delay: 3.1s; animation-duration: 5.62s; font-size: 10px;">
            -SYS\|0x⚡SYS10
        </text>
        </g>
    <rect class="h-scanline" />
  </g>
  
  <rect width="800" height="200" fill="url(#h-mask-grad)" pointer-events="none"/>
  <ellipse cx="400.0" cy="115" rx="280" ry="65" fill="url(#h-text-shield-standalone)" pointer-events="none"/>

  <!-- Main Content -->
  <text x="400.0" y="95" text-anchor="middle" dominant-baseline="middle" class="h-title">blackalex1</text>
  <text x="400.0" y="142" text-anchor="middle" class="h-subtitle">Infosec Researcher | Reverse Engineer</text>
  <text x="400.0" y="168" text-anchor="middle" class="h-tagline">[ ARCH: x86_64 // ARM64 // WIN_NT // LINUX_KERNEL ]</text>

  <!-- Precision Corner Accents -->
  <path d="M 28 12 L 12 12 L 12 28" class="h-corner" />
  <path d="M 772 12 L 788 12 L 788 28" class="h-corner" />
  <path d="M 28 188 L 12 188 L 12 172" class="h-corner" />
  <path d="M 772 188 L 788 188 L 788 172" class="h-corner" />
  
  <!-- Center Crosshairs -->
  <path d="M 395.0 100 L 405.0 100 M 400.0 95 L 400.0 105" class="h-reticle" opacity="0.2"/>
</svg>