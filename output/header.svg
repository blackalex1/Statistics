        </text>
        
        <text x="64" y="-30" class="h-matrix-text" style="animation-delay: 2.33s; animation-duration: 4.92s; font-size: 11px;">
            -⚡█{0ROOT}0x/
        </text>
        
        <text x="88" y="-30" class="h-matrix-text" style="animation-delay: 2.92s; animation-duration: 4.67s; font-size: 12px;">
            DIR&gt;0ROOT}{-SYS0
        </text>
        
        <text x="112" y="-30" class="h-matrix-text" style="animation-delay: 3.37s; animation-duration: 6.29s; font-size: 10px;">
            [__-EXE-0/&gt;
        </text>
        
        <text x="136" y="-30" class="h-matrix-text" style="animation-delay: 1.14s; animation-duration: 4.7s; font-size: 12px;">
            {[EXE_0EXE]ROOT[
        </text>
        
        <text x="160" y="-30" class="h-matrix-text" style="animation-delay: 1.49s; animation-duration: 4.71s; font-size: 10px;">
            &gt;1|⚡-_DIRROOT-
        </text>
        
        <text x="184" y="-30" class="h-matrix-text" style="animation-delay: 1.04s; animation-duration: 4.62s; font-size: 10px;">
            SYS\}{0EXE\\█
        </text>
        
        <text x="208" y="-30" class="h-matrix-text" style="animation-delay: 1.1s; animation-duration: 5.12s; font-size: 11px;">
            EXE}]/--[&lt;|
        </text>
        
        <text x="600" y="-30" class="h-matrix-text" style="animation-delay: 1.81s; animation-duration: 6.1s; font-size: 11px;">
            EXEDIR{&gt;█/DIR👾SYS
        </text>
        
        <text x="624" y="-30" class="h-matrix-text" style="animation-delay: 0.93s; animation-duration: 5.58s; font-size: 10px;">
            |/EXE-]|}[&gt;
        </text>
        
        <text x="648" y="-30" class="h-matrix-text" style="animation-delay: 2.11s; animation-duration: 6.65s; font-size: 12px;">
            ROOT0}_&gt;&lt;\]|
        </text>
        
        <text x="672" y="-30" class="h-matrix-text" style="animation-delay: 0.24s; animation-duration: 6.76s; font-size: 12px;">
            1█EXE1DIR/&gt;EXE{
        </text>
        
        <text x="696" y="-30" class="h-matrix-text" style="animation-delay: 1.09s; animation-duration: 4.97s; font-size: 12px;">
            ROOT/1&gt;_|1}EXE
        </text>
        
        <text x="720" y="-30" class="h-matrix-text" style="animation-delay: 1.06s; animation-duration: 5.74s; font-size: 11px;">
            }_{__&gt;_\1
        </text>
        
        <text x="744" y="-30" class="h-matrix-text" style="animation-delay: 2.45s; animation-duration: 4.69s; font-size: 10px;">
            👾SYS-_|[1⚡[
        </text>
        
        <text x="768" y="-30" class="h-matrix-text" style="animation-delay: 3.06s; animation-duration: 4.59s; font-size: 12px;">
            👾EXE█\ROOT{}_&gt;
        </text>
        </g>
    <rect class="h-scanline" />
  </g>
  
  <rect width="800" height="200" fill="url(#h-mask-grad)" pointer-events="none"/>
  <ellipse cx="400.0" cy="115" rx="280" ry="65" fill="url(#h-text-shield-standalone)" pointer-events="none"/>

  <!-- Main Content -->
  <text x="400.0" y="95" text-anchor="middle" dominant-baseline="middle" class="h-title">blackalex1</text>
  <text x="400.0" y="142" text-anchor="middle" class="h-subtitle">Infosec Researcher | Reverse Engineer</text>
  <text x="400.0" y="168" text-anchor="middle" class="h-tagline">[ ARCH: x86_64 // ARM64 // WIN_NT // LINUX_KERNEL ]</text>

  <!-- Precision Corner Accents -->
  <path d="M 28 12 L 12 12 L 12 28" class="h-corner" />
  <path d="M 772 12 L 788 12 L 788 28" class="h-corner" />
  <path d="M 28 188 L 12 188 L 12 172" class="h-corner" />
  <path d="M 772 188 L 788 188 L 788 172" class="h-corner" />
  
  <!-- Center Crosshairs -->
  <path d="M 395.0 100 L 405.0 100 M 400.0 95 L 400.0 105" class="h-reticle" opacity="0.2"/>
</svg>