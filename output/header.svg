            10{DIR⚡&lt;SYSDIR0
        </text>
        
        <text x="696" y="-30" class="h-matrix-text" style="animation-delay: 2.77s; animation-duration: 6.65s; font-size: 11px;">
            0SYS[EXESYSEXE0x0⚡
        </text>
        
        <text x="720" y="-30" class="h-matrix-text" style="animation-delay: 0.92s; animation-duration: 6.78s; font-size: 12px;">
            EXE⚡/|0DIR⚡&lt;&lt;
        </text>
        
