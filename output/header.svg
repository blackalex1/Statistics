<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="h-clip-standalone">
      <rect width="800" height="200" rx="12"/>
    </clipPath>
    <radialGradient id="h-text-shield-standalone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--h-bg)" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="var(--h-bg)" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="var(--h-bg)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-mask-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--h-bg)" stop-opacity="1"/>
      <stop offset="18%" stop-color="var(--h-bg)" stop-opacity="0"/>
      <stop offset="82%" stop-color="var(--h-bg)" stop-opacity="0"/>
      <stop offset="100%" stop-color="var(--h-bg)" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <style>
    :root { 
      --h-bg: #0d1117; 
      --h-text: #ffffff; 
      --h-accent: #00FFAA; 
      --h-border: #30363d;
      --h-muted: #8b949e;
      --h-matrix-opacity: 0.22;
    }
    @media (prefers-color-scheme: light) { 
      :root { 
        --h-bg: #ffffff; 
        --h-text: #1f2328; 
        --h-accent: #1a7f37;
        --h-border: #d0d7de;
        --h-muted: #57606a;
        --h-matrix-opacity: 0.35;
      } 
    }

    .h-bg { fill: var(--h-bg); stroke: var(--h-border); stroke-width: 1.5; }

    .h-title { 
      font: bold 52px 'JetBrains Mono', 'Segoe UI', monospace; 
      fill: var(--h-accent); 
      text-transform: uppercase; 
      letter-spacing: 8px;
      animation: h-glitch 6s infinite ease-in-out;
      transform-origin: center;
    }
    
    .h-subtitle { 
      font: bold 14px 'JetBrains Mono', 'Courier New', monospace; 
      fill: var(--h-text); 
      letter-spacing: 3px; 
      text-transform: uppercase;
      opacity: 0.9;
    }

    .h-tagline {
      font: bold 10px 'JetBrains Mono', monospace;
      fill: var(--h-muted);
      letter-spacing: 2px;
      opacity: 0.75;
    }

    .h-matrix-text { 
      font: bold 12px monospace;
      fill: var(--h-accent); 
      opacity: 0; 
      writing-mode: vertical-rl; 
      animation: h-fall linear infinite; 
    }

    @keyframes h-glitch {
      0%, 88%, 100% { transform: none; opacity: 1; }
      89% { transform: skew(-3deg) translate(-2px, 1px); opacity: 0.85; }
      90% { transform: skew(3deg) translate(2px, -1px); opacity: 0.9; }
      91% { transform: none; opacity: 1; }
      95% { transform: translate(-2px, -1px); }
      96% { transform: translate(2px, 1px); }
      97% { transform: none; }
    }

    @keyframes h-fall { 
      0% { transform: translateY(-40px); opacity: 0; } 
      15% { opacity: var(--h-matrix-opacity); } 
      80% { opacity: var(--h-matrix-opacity); } 
      100% { transform: translateY(200px); opacity: 0; } 
    }

    .h-scanline {
      width: 800px;
      height: 2px;
      fill: var(--h-accent);
      opacity: 0.08;
      animation: h-scan 4s infinite linear;
    }
    @keyframes h-scan {
      0% { transform: translateY(0); }
      100% { transform: translateY(200px); }
    }

    .h-corner { stroke: var(--h-accent); stroke-width: 2; fill: none; opacity: 0.8; stroke-linecap: square; }
    .h-reticle { stroke: var(--h-muted); stroke-width: 1; opacity: 0.4; }
  </style>

  <rect width="800" height="200" rx="12" class="h-bg"/>
  
  <g clip-path="url(#h-clip-standalone)">
    <g opacity="1">
        <text x="16" y="-30" class="h-matrix-text" style="animation-delay: 0.98s; animation-duration: 4.72s; font-size: 11px;">
            👾EXE|&gt;DIR/}-0x
        </text>
        
        <text x="40" y="-30" class="h-matrix-text" style="animation-delay: 3.33s; animation-duration: 5.98s; font-size: 12px;">
            ⚡⚡SYS⚡}ROOT█{⚡
        </text>
        
        <text x="64" y="-30" class="h-matrix-text" style="animation-delay: 2.53s; animation-duration: 6.73s; font-size: 11px;">
            11[1DIR👾[[ROOT
        </text>
        
        <text x="88" y="-30" class="h-matrix-text" style="animation-delay: 0.52s; animation-duration: 5.07s; font-size: 11px;">
            ROOTDIR]⚡ROOT]1ROOT]
        </text>
        
        <text x="112" y="-30" class="h-matrix-text" style="animation-delay: 1.56s; animation-duration: 4.68s; font-size: 12px;">
            [0xSYS0xDIRSYS}DIR█
        </text>
        
        <text x="136" y="-30" class="h-matrix-text" style="animation-delay: 2.11s; animation-duration: 6.07s; font-size: 10px;">
            DIRDIR\0|SYSEXEEXE👾
        </text>
        
        <text x="160" y="-30" class="h-matrix-text" style="animation-delay: 0.93s; animation-duration: 6.9s; font-size: 12px;">
            }&gt;]|[[{_\
        </text>
        
        <text x="184" y="-30" class="h-matrix-text" style="animation-delay: 2.05s; animation-duration: 4.75s; font-size: 10px;">
            &lt;ROOT{1|⚡0SYS&lt;
        </text>
        
        <text x="208" y="-30" class="h-matrix-text" style="animation-delay: 0.58s; animation-duration: 6.95s; font-size: 11px;">
            00x👾/👾]/]█
        </text>
        
        <text x="600" y="-30" class="h-matrix-text" style="animation-delay: 0.95s; animation-duration: 6.0s; font-size: 12px;">
            &lt;1&gt;👾⚡⚡0/EXE
        </text>
        
        <text x="624" y="-30" class="h-matrix-text" style="animation-delay: 0.58s; animation-duration: 5.57s; font-size: 11px;">
            |&gt;⚡SYS|-0x1\
        </text>
        
        <text x="648" y="-30" class="h-matrix-text" style="animation-delay: 3.43s; animation-duration: 5.71s; font-size: 10px;">
            ]0x1ROOT0_&gt;⚡👾
        </text>
        
        <text x="672" y="-30" class="h-matrix-text" style="animation-delay: 0.43s; animation-duration: 5.67s; font-size: 10px;">
            |}-{█[\&lt;ROOT
        </text>
        
        <text x="696" y="-30" class="h-matrix-text" style="animation-delay: 3.26s; animation-duration: 6.04s; font-size: 12px;">
            EXESYS👾\{&lt;█}&lt;
        </text>
        
        <text x="720" y="-30" class="h-matrix-text" style="animation-delay: 1.79s; animation-duration: 6.64s; font-size: 12px;">
            \[}}⚡]\-ROOT
        </text>
        
        <text x="744" y="-30" class="h-matrix-text" style="animation-delay: 3.25s; animation-duration: 4.76s; font-size: 11px;">
            \}}}|EXE-/⚡
        </text>
        
        <text x="768" y="-30" class="h-matrix-text" style="animation-delay: 2.01s; animation-duration: 5.14s; font-size: 12px;">
            ⚡&lt;1█{-}EXE&gt;
        </text>
        </g>
    <rect class="h-scanline" />
  </g>
  
  <rect width="800" height="200" fill="url(#h-mask-grad)" pointer-events="none"/>
  <ellipse cx="400.0" cy="115" rx="280" ry="65" fill="url(#h-text-shield-standalone)" pointer-events="none"/>

  <!-- Main Content -->
  <text x="400.0" y="95" text-anchor="middle" dominant-baseline="middle" class="h-title">blackalex1</text>
  <text x="400.0" y="142" text-anchor="middle" class="h-subtitle">Infosec Researcher | Reverse Engineer</text>
  <text x="400.0" y="168" text-anchor="middle" class="h-tagline">[ ARCH: x86_64 // ARM64 // WIN_NT // LINUX_KERNEL ]</text>

  <!-- Precision Corner Accents -->
  <path d="M 28 12 L 12 12 L 12 28" class="h-corner" />
  <path d="M 772 12 L 788 12 L 788 28" class="h-corner" />
  <path d="M 28 188 L 12 188 L 12 172" class="h-corner" />
  <path d="M 772 188 L 788 188 L 788 172" class="h-corner" />
  
  <!-- Center Crosshairs -->
  <path d="M 395.0 100 L 405.0 100 M 400.0 95 L 400.0 105" class="h-reticle" opacity="0.2"/>
</svg>