        </text>
        
        <text x="208" y="-30" class="h-matrix-text" style="animation-delay: 3.36s; animation-duration: 6.38s; font-size: 12px;">
            |👾]ROOT0x[SYS👾SYS
        </text>
        
        <text x="600" y="-30" class="h-matrix-text" style="animation-delay: 1.57s; animation-duration: 6.48s; font-size: 11px;">
