        </text>
        
        <text x="136" y="-30" class="h-matrix-text" style="animation-delay: 1.87s; animation-duration: 5.63s; font-size: 12px;">
            -|█&gt;⚡&gt;-ROOT█
        </text>
        
        <text x="160" y="-30" class="h-matrix-text" style="animation-delay: 0.21s; animation-duration: 5.67s; font-size: 11px;">
            \-&lt;⚡_]&gt;SYS⚡
        </text>
        
        <text x="184" y="-30" class="h-matrix-text" style="animation-delay: 0.57s; animation-duration: 6.84s; font-size: 12px;">
            {DIR]_ROOT0x&lt;|EXE
        </text>
        
        <text x="208" y="-30" class="h-matrix-text" style="animation-delay: 0.47s; animation-duration: 6.15s; font-size: 10px;">
            0x1]]DIREXEROOT/&lt;
        </text>
        
        <text x="600" y="-30" class="h-matrix-text" style="animation-delay: 3.17s; animation-duration: 6.32s; font-size: 12px;">
            0\_DIRROOT{█0&gt;
        </text>
        
        <text x="624" y="-30" class="h-matrix-text" style="animation-delay: 0.22s; animation-duration: 6.51s; font-size: 10px;">
            &gt;&lt;1_⚡1EXE-⚡
        </text>
        
        <text x="648" y="-30" class="h-matrix-text" style="animation-delay: 1.73s; animation-duration: 6.97s; font-size: 10px;">
            |0xEXEDIREXE0&gt;{EXE
        </text>
        
        <text x="672" y="-30" class="h-matrix-text" style="animation-delay: 1.02s; animation-duration: 6.63s; font-size: 11px;">
            _SYS0DIR{/0SYSEXE
        </text>
        
        <text x="696" y="-30" class="h-matrix-text" style="animation-delay: 1.12s; animation-duration: 5.11s; font-size: 11px;">
            -⚡|\EXE}SYS\👾
        </text>
        
        <text x="720" y="-30" class="h-matrix-text" style="animation-delay: 2.23s; animation-duration: 6.91s; font-size: 10px;">
            █0xDIR&lt;\[█\|
        </text>
        
        <text x="744" y="-30" class="h-matrix-text" style="animation-delay: 0.66s; animation-duration: 4.64s; font-size: 11px;">
            _SYS[0x█0DIR}|
        </text>
        
        <text x="768" y="-30" class="h-matrix-text" style="animation-delay: 2.57s; animation-duration: 6.54s; font-size: 11px;">
            ⚡EXE⚡[/👾_-&lt;
        </text>
        </g>
    <rect class="h-scanline" />
  </g>
  
  <rect width="800" height="200" fill="url(#h-mask-grad)" pointer-events="none"/>
  <ellipse cx="400.0" cy="115" rx="280" ry="65" fill="url(#h-text-shield-standalone)" pointer-events="none"/>

  <!-- Main Content -->
  <text x="400.0" y="95" text-anchor="middle" dominant-baseline="middle" class="h-title">blackalex1</text>
  <text x="400.0" y="142" text-anchor="middle" class="h-subtitle">Infosec Researcher | Reverse Engineer</text>
  <text x="400.0" y="168" text-anchor="middle" class="h-tagline">[ ARCH: x86_64 // ARM64 // WIN_NT // LINUX_KERNEL ]</text>

  <!-- Precision Corner Accents -->
  <path d="M 28 12 L 12 12 L 12 28" class="h-corner" />
  <path d="M 772 12 L 788 12 L 788 28" class="h-corner" />
  <path d="M 28 188 L 12 188 L 12 172" class="h-corner" />
  <path d="M 772 188 L 788 188 L 788 172" class="h-corner" />
  
  <!-- Center Crosshairs -->
  <path d="M 395.0 100 L 405.0 100 M 400.0 95 L 400.0 105" class="h-reticle" opacity="0.2"/>
</svg>